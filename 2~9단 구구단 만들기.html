<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단 만들기</title>
</head>
<body>
    <h1>구구단(2~9)</h1>
    <script>
        let dan = 2;
        let num = 1;

        for(dan = 2; dan <= 9; dan = dan + 1) {
            for( num = 1; num <= 9; num++ ) {
                document.write( dan + ' x ' + num + ' = ' + (dan * num) + '<br>' );
            }
            document.write('<br>')
        }
    </script>
</body>
</html>
