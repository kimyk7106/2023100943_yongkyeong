<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시간표 꾸미</title>

    <!-- 웹 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">

    <style>
        /* 전체 페이지 */
        body {
            background-color: #f4f7fb;
            margin: 40px;
            text-align: center;
        }

        /* 제목 */
        h1 {
            font-weight: 350;
            margin-bottom: 30px;
        }

        /* 시간표 */
        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        /* 요일 */
        th {
            background-color: darkblue;
            color: white;
            height: 50px;
            font-size: 18px;
        }

        /* 시간표 칸 */
        td {
            border: 1px solid #d6dce5;
            height: 55px;
            font-size: 15px;
        }

        /* 시간 */
        td:first-child {
            background-color: #eef2f7;
            font-weight: bold;
            color: #34495e;
            width: 60px;
        }

        /* 강의실 글씨 */
        h5 {
            margin: 5px;
            color: #777;
            font-weight: normal;
            line-height: 1.4;
        }

        /* 과목별 색상 */
        .health {
            background-color: #e3f2fd;
        }

        .thermo {
            background-color: #e8f5e9;
        }

        .history {
            background-color: #f3e5f5;
        }

        .circuit {
            background-color: #fff3e0;
        }

        .web {
            background-color: #fce4ec;
        }

        .semiconductor {
            background-color: #fffde7;
        }

        .digital {
            background-color: #ffebee;
        }

        .career {
            background-color: #e0f7fa;
        }

        .chapel {
            background-color: #f1f8e9;
        }
    </style>
</head>

<body>

    <h1>2023100943_김용경</h1>

    <table>
        <thead>
            <tr>
                <th></th>
                <th>월</th>

                <th>목</th>
                <th>금</th>
            </tr>
        </thead>

        <tbody>

            <tr>

                    건강과 운동

                        바울관 203호<br>
                        (PBL)강의실

                </td>

                <td></td>

                </td>

                <td></td>
            </tr>

            <tr>
                <td>10</td>
                <td></td>

                <td class="chapel">
                    채플
                    <h5>
                        대강당(메인)

                </td>

                <td></td>
            </tr>

            <tr>

            </tr>

            <tr>
                <td>12</td>

                <td></td>
            </tr>

            <tr>
                <td>1</td>
                <td></td>
                <td></td>
                <td></td>

                <td></td>

                <td rowspan="3" class="circuit">

            </tr>

            <tr>

                </td>

                <td></td>
                <td></td>
                <td></td>

            </tr>

        </tbody>
    </table>

</body>
</html>
