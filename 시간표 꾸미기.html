<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>시간표 꾸미기</title>

    <!-- 웹 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap"
          rel="stylesheet">

    <style>

        /* 전체 화면 */
        body {
            background-color: white;
        }

        /* 제목 */
        h1 {
            font-weight: 400;
            background-color: white;
            text-align: center;
        }

        /* 시간표 */
        table {
            width: 750px;
            height: 750px;

            margin: 50px;

            border: 2px solid black;
            background-color: white;
        }

        /* 요일 */
        th {
            border: 1px solid black;
            background-color: darkgray;
            color: white;

            height: 50px;
        }

        /* 시간표 칸 */
        td {
            border: 1px solid;
            height: 50px;
            text-align: left;
        }

        /* 시간 칸 */
        .time {
            width: 60px;
            background-color: darkgray;
            text-align: center;
        }

        /* 과목별 배경색 */
        .health {
            background-color: rgb(245, 227, 133);
        }

        .thermo {
            background-color: rgb(214, 157, 247);
        }

        .history {
            background-color: rgb(255, 191, 139);
        }

        .chapel {
            background-color: rgb(148, 212, 255);
        }

        .circuit {
            background-color: rgb(246, 195, 255);
        }

        .web {
            background-color: rgb(215, 255, 189);
        }

        .semiconductor {
            background-color: rgb(154, 255, 149);
        }

        .digital {
            background-color: rgb(255, 164, 134);
        }

        .career {
            background-color: rgb(160, 241, 194);
        }

        /* 강의실 정보 */
        h5 {
            font-weight: normal;
            margin: 3px;
            text-align: left;
        }

    </style>
</head>


<body>

    <h1>2023100943_김용경</h1>


    <table>

        <thead>
            <tr>
                <th></th>
                <th>월</th>
                <th>화</th>
                <th>수</th>
                <th>목</th>
                <th>금</th>
            </tr>
        </thead>


        <tbody>

            <tr>
                <td class="time">9</td>

                <td></td>

                <td rowspan="3" class="health">
                    건강과 운동
                    <h5>
                        바울관 203호<br>
                        (PBL)강의실
                    </h5>
                </td>

                <td></td>

                <td rowspan="3" class="thermo">
                    열역학
                    <h5>
                        제1실습관 202호<br>
                        강의실
                    </h5>
                </td>

                <td></td>
            </tr>


            <tr>
                <td class="time">10</td>

                <td></td>

                <td class="chapel">
                    채플
                    <h5>
                        대강당(메인)
                    </h5>
                </td>

                <td></td>

            </tr>


            <tr>
                <td class="time">11</td>

                <td></td>

                <td rowspan="2" class="history">
                    역사와 문화
                    <h5>
                        다니엘관 304호
                    </h5>
                </td>

                <td></td>

            </tr>


            <tr>
                <td class="time">12</td>

                <td></td>
                <td></td>
                <td></td>
                <td></td>

            </tr>


            <tr>
                <td class="time">1</td>

                <td></td>
                <td></td>
                <td></td>
                <td></td>

                <td rowspan="3" class="circuit">
                    회로이론1
                    <h5>
                        바울관 203호<br>
                        (PBL)강의실
                    </h5>
                </td>

            </tr>


            <tr>
                <td class="time">2</td>

                <td></td>

                <td rowspan="3" class="web">
                    웹프로그래밍
                    <h5>
                        바울관 303호<br>
                        (AIC프로젝트<br>
                        LAB실)
                    </h5>
                </td>

                <td></td>

                <td rowspan="3" class="semiconductor">
                    AI반도체공정
                    <h5>
                        제1실습관 202호<br>
                        강의실
                    </h5>
                </td>

            </tr>


            <tr>
                <td class="time">3</td>

                <td rowspan="3" class="digital">
                    디지털 논리회로
                    <h5>
                        요한관 223호<br>
                        (교필토익전<br>
                        용)강의실
                    </h5>
                </td>

                <td></td>

            </tr>


            <tr>
                <td class="time">4</td>

                <td></td>
                <td></td>

            </tr>


            <tr>
                <td class="time">5</td>

                <td class="career">
                    인생설계와 진로2
                    <h5>
                        제1실습관 208호
                    </h5>
                </td>

                <td></td>
                <td></td>
                <td></td>

            </tr>

        </tbody>

    </table>

</body>
</html>
